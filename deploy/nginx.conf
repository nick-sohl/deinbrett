server {
    listen 80;
    server_name deinbrett.ch www.deinbrett.ch;

    # Redirect HTTP → HTTPS (certbot will populate this block)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name deinbrett.ch www.deinbrett.ch;

    root /var/www/deinbrett/public;
    index index.php;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/deinbrett.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deinbrett.ch/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip              on;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Static assets — long cache
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PHP via FPM
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   unix:/run/php/php8.5-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 30;
    }

    # Block access to sensitive files and directories
    location ~ /\.(env|git|htaccess) { deny all; }
    location ~* (composer\.json|composer\.lock|package\.json|package-lock\.json)$ { deny all; }
    location ^~ /db/    { deny all; }
    location ^~ /src/   { deny all; }
    location ^~ /views/ { deny all; }
    location ^~ /resources/ { deny all; }
    location ^~ /deploy/ { deny all; }

    # Logs
    access_log /var/log/nginx/deinbrett.access.log;
    error_log  /var/log/nginx/deinbrett.error.log;
}
